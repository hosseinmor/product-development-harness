name: PR 7 temporary validation

on:
  push:
    branches:
      - docs/gitlab-canonical-manual-pilot
  workflow_dispatch:

jobs:
  deterministic-validation:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: evals/orchestrator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: evals/orchestrator/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Runtime guardrails
        run: npm run test:runtime-guardrails
      - name: Authority ledger
        run: npm run test:runtime-authority-ledger
      - name: Clarification materiality
        run: npm run test:runtime-clarification-materiality
      - name: Alignment guard
        run: npm run test:runtime-alignment-guard
      - name: Fixture router
        run: npm run test:fixture-router
