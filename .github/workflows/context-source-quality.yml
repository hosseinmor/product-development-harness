name: Context source quality

on:
  pull_request:
    paths:
      - context-sources.yml
      - scripts/check_context_sources.py
      - requirements-dev.txt
      - .github/workflows/context-source-quality.yml
  push:
    branches: [main]
    paths:
      - context-sources.yml
      - scripts/check_context_sources.py
      - requirements-dev.txt
      - .github/workflows/context-source-quality.yml

permissions:
  contents: read

jobs:
  check-context-sources:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/check_context_sources.py
