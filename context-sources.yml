# Runtime source registry. This is a locator, not a copy of source-owned rules.
# Access descriptions are requirements to verify, not claims of access in this session.
schema_version: "1"
sources:
  jobvision_product_knowledge:
    authority: current_product_meaning_and_behavior
    product_scope: jobvision
    location: https://docs-jv.jvoffice.ir/
    entry_point: https://docs-jv.jvoffice.ir/
    access: verify_source_scoped_mcp_read_then_internal_browser
    preferred_transport:
      server: jv-platform
      endpoint: https://mcp.jvoffice.ir/platform/docs/mcp
      source: jobvision
      discovery: list_sources
      search: search_docs
      read: get_doc
    fallback: verified_local_internal_browser
    retrieval: smallest_relevant_pages

  cando_product_knowledge:
    authority: current_product_meaning_and_behavior
    product_scope: cando
    location: https://docs-cd.jvoffice.ir/
    entry_point: https://docs-cd.jvoffice.ir/
    access: verify_source_scoped_mcp_read_then_internal_browser
    preferred_transport:
      server: jv-platform
      endpoint: https://mcp.jvoffice.ir/platform/docs/mcp
      source: cando
      discovery: list_sources
      search: search_docs
      read: get_doc
    fallback: verified_local_internal_browser
    retrieval: smallest_relevant_pages

  design_language:
    authority: reusable_design_and_interaction_rules
    current_repository: https://github.com/hosseinmor/design-language
    entry_point: AGENTS.md
    discovery: registry/manifest.generated.json
    access: verify_repository_read
    retrieval: agents_then_ai_router_then_smallest_owning_document

  content_system:
    authority: product_language_and_expression_rules
    current_repository: https://github.com/hosseinmor/design-language
    entry_point: foundations/content/README.md
    discovery: registry/manifest.generated.json
    access: verify_repository_read
    retrieval: content_entry_then_relevant_foundation_pattern_component_or_eval

  product_walkthrough:
    authority: reviewed_experience_evidence_not_product_policy
    resolution: resolve_relevant_reviewed_source_per_task
    access: verify_at_runtime
    retrieval: relevant_journeys_only

  current_prd:
    authority: pm_owned_intended_product_change
    resolution: resolve_current_durable_artifact_per_task
    access: verify_at_runtime
    retrieval: current_artifact_only
    read_access:
      indexed_server: jv-platform
      indexed_sources: [prd-jobvision, prd-cando]
      direct_server: jv-gitlab
      direct_endpoint: https://mcp.jvoffice.ir/platform/gitlab/mcp
      policy: identified_artifact_only_verify_identity_and_currentness
    publication: automatic_when_aligned_and_writable_else_report_blocker

  current_design_artifact:
    authority: designer_owned_selected_experience
    resolution: resolve_current_durable_artifact_per_task
    access: verify_at_runtime
    retrieval: current_artifact_only

  other_evidence:
    authority: evidence_only
    resolution: resolve_per_task
    access: verify_at_runtime
    retrieval: materially_relevant_evidence_only
