# PRD publication parents aligned to the canonical Product Knowledge taxonomy.
# The PM excludes the JobVision platform area from PRD placement; its absence here
# does not remove it from Product Knowledge.
# Read the live canonical Knowledge source to determine product ownership and update this
# inventory whenever its structure changes. Do NOT read GitLab Wiki to refresh it.
# JobVision paths below reflect the Knowledge taxonomy and Wiki hierarchy.
# The docs site may serve area pages from flat /contents/<area>/ URLs; those
# browser URLs are not the PRD parent paths. Use each complete path below.
# Do NOT browse previous PRDs or GitLab Wiki during new-PRD drafting.
# Choose the primary area that owns the changed product behavior, even when several
# panels or areas are affected. Record other affected areas as PRD references.
# Do not invent a child area; use only a verified path from the taxonomy.
# If the owning area is unknown, use wiki_path: unresolved.
# Published paths stay stable unless an explicit move is approved.
schema_version: "2"
checked_on: "2026-10-26"
products:
  cando:
    product_knowledge_source: cando_product_knowledge
    # Group keys mirror the first path segment; values are complete PRD parents.
    # Select the owning area, then use its full value (e.g. ats/job), not just job.
    knowledge_areas:
      shared:
        - shared/ai
      ats:
        - ats/hiring-request
        - ats/job
        - ats/candidate
        - ats/application
        - ats/interview
        - ats/evaluation
        - ats/career-page
        - ats/sourcing
        - ats/operator
        - ats/organization
        - ats/notification
        - ats/report
      salary:
        - salary/personnel
        - salary/job-profile
        - salary/benchmark
        - salary/settings
        - salary/report
      calendar:
        - calendar/calendar-access
        - calendar/event
        - calendar/availability
        - calendar/sync
      learning:
        - learning/access
      pulse:
        - pulse/survey
        - pulse/questionnaire
        - pulse/response
        - pulse/org-chart
        - pulse/report
        - pulse/action
        - pulse/notification
        - pulse/tenant
      onb:
        - onb/onboardee
        - onb/template
        - onb/notification
        - onb/feedback-evaluation
        - onb/welcome
        - onb/access
        - onb/tenant
  jobvision:
    product_knowledge_source: jobvision_product_knowledge
    # Values are complete PRD parent paths; include the group in Wiki Path.
    # _common, candidate, employer, and root backoffice are the Wiki parents.
    knowledge_areas:
      shared:
        - _common/company-review
        - _common/jobpost
        - _common/application
        - _common/job-fair
        - _common/assessment
        - _common/matching
        - _common/scoring
        - _common/ai
      candidate:
        - candidate/account
        - candidate/cv
        - candidate/career-guide
        - candidate/content
        - candidate/candidate-premium
        - candidate/channels
        - candidate/learning
        - candidate/market-insights
        - candidate/nationwide
        - candidate/job-search
      employer:
        - employer/company
        - employer/operator
        - employer/talent-search
        - employer/talent-pool
        - employer/suggested-cv
        - employer/package
        - employer/billing
        - employer/campaign
      backoffice:
        - backoffice
