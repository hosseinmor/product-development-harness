# Canonical Product Knowledge area inventory plus independently verified Wiki parent translations.
# knowledge_areas: ALL areas with an /contents/<area>/0_overview/ page seen in the
# product's loaded Product Knowledge navigation (not a copied product taxonomy or Wiki scan).
# verified_areas: only area -> existing GitLab Wiki parent mappings separately verified.
# Area inventory NEVER proves that a corresponding Wiki page/path exists.
# For a new area, update knowledge_areas from canonical Knowledge; only add a
# verified_areas mapping after independently validating the actual destination Wiki parent.
# Routes are case-sensitive. This is a point-in-time snapshot (not live synchronization).
