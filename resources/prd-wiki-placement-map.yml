# Verified Product Knowledge area -> GitLab Wiki parent-path mapping for PRD publication.
# This is a translation of existing navigational paths, NOT a Product Knowledge taxonomy.
# Map keys are canonical Product Knowledge AREA paths relative to /contents/ (not document URLs).
# Map values are existing GitLab Wiki parent paths (relative to /-/wikis/, case-sensitive).
# Only add an area after validating both the canonical Knowledge area and the actual Wiki parent.
# This is a point-in-time snapshot; re-check after upstream navigation changes.
schema_version: "1"
checked_on: "2026-10-26"
products:
  cando:
    product_knowledge_source: cando_product_knowledge
    wiki_project: product/prd/cando
    verified_areas:
      ats/hiring-request: ATS/hiring-request
      ats/job: ATS/job
      ats/candidate: ATS/candidate
      ats/application: ATS/application
      ats/interview: ATS/interview
      ats/evaluation: ATS/evaluation
      ats/career-page: ATS/career-page
      ats/sourcing: ATS/sourcing
      ats/operator: ATS/operator
      ats/organization: ATS/organization
      ats/notification: ATS/notification
      ats/report: ATS/report
    # Pending verification: salary/*, calendar/*, learning/*, pulse/*, onb/*.
    # Seeing a group root (such as 'salary') is NOT verification of each child area.

  jobvision:
    product_knowledge_source: jobvision_product_knowledge
    wiki_project: product/prd/jobvision
    verified_areas:
      job-search: candidate/job-discovery
      candidate-premium: candidate/jobvision-pro
    # JobVision Knowledge has 27 area overview paths in the inspected sidebar.
    # The Wiki groups its paths by audience/journey rather than mirroring those
    # areas one-for-one. These two associations have direct contextual support:
    # job-search -> Job Discovery (search-related sample PRD);
    # candidate-premium -> JobVision Pro (independent premium-pack PRD).
    # Pending: cv vs candidate/onboarding-cv; application vs
    # candidate/apply-follow-up / employer applicant-management;
    # company-review vs candidate/company-transparency; career-guide vs
    # candidate/career-growth; and other knowledge areas.
    # Do not treat those pending associations as verified mappings.
